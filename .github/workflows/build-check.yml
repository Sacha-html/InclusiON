name: Build Check

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore InclusiON.slnx

      - name: Build
        run: dotnet build InclusiON.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test InclusiON.Tests/Unit/InclusiON.Tests.Unit.csproj --no-build --configuration Release --verbosity normal

      - name: Run integration tests
        run: dotnet test InclusiON.Tests/Integration/InclusiON.Tests.Integration.csproj --no-build --configuration Release --verbosity normal

  python:
    name: Python Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Inclusion.Agent
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check syntax
        run: python -m py_compile main.py services/*.py

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t inclusion-api InclusiON.Server
      - name: Build Python agent image
        run: docker build -t inclusion-agent Inclusion.Agent
