name: Build Check

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore InclusiON.slnx

      - name: Build
        run: dotnet build InclusiON.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test InclusiON.Tests/Unit/InclusiON.Tests.Unit.csproj --no-build --configuration Release --verbosity normal

      - name: Run integration tests
        run: dotnet test InclusiON.Tests/Integration/InclusiON.Tests.Integration.csproj --no-build --configuration Release --verbosity normal

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t inclusion-api .
