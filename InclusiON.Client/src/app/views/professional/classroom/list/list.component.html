@if (isLoading) {
  <div class="text-center p-5">
    <c-spinner color="primary"></c-spinner>
  </div>
} @else {

  <c-card class="mb-4">
    <!-- listado de aula del profesional -->
    <c-card-header>
      <h5 class="mb-0">Mi Aula</h5>
    </c-card-header>
    <c-card-body>

      @if (hasClassrooms) {
        <div class="mb-4 row align-items-center">
          <div class="col-12 col-md-4">
            <label for="classroomSelect" class="form-label fw-semibold text-body-secondary small text-uppercase" style="letter-spacing: .04em;">Aula seleccionada</label>
            <select id="classroomSelect" class="form-select" [(ngModel)]="selectedClassroomId">
              @for (c of classrooms; track c.id) {
                <option [value]="c.id">{{ c.name }} ({{ c.studentCount }} alumno{{ c.studentCount !== 1 ? 's' : '' }})</option>
              }
              <option value="unassigned">Sin Aula (Asignación General)</option>
            </select>
          </div>
        </div>
      }

      @if (!hasClassrooms) {
        <app-empty-state
          icon="cil-school"
          message="No tenés aulas creadas"
          detail="Solicitá al administrador que te cree un aula."
        />
      } @else if (filteredPersons.length === 0) {
        <app-empty-state
          icon="cil-people"
          message="Esta aula no tiene alumnos asignados"
          detail="Solicitá al administrador que asigne alumnos a esta aula."
        />
      }

      <c-row>
        @for (person of filteredPersons; track person.personId) {
          <c-col sm="6" md="4" lg="3" class="mb-4 d-flex">
            <button type="button" class="person-card" (click)="goToDetail(person)" [attr.aria-label]="'Ver detalle de ' + person.personFullName" [style.--card-accent]="person.avatarColor || '#9E9E9E'">
              <!-- Avatar -->
              <app-actor-avatar
                [name]="person.personFullName"
                [color]="person.avatarColor"
                size="lg"
              />

              <!-- Info -->
              <div class="person-info">
                <h6 class="person-name mb-1">{{ person.personFullName }}</h6>

                @if (person.disabilityTypeName) {
                  <small class="text-body-secondary d-block">{{ person.disabilityTypeName }}</small>
                }

                @if (person.age) {
                  <small class="text-body-secondary">{{ person.age }} años</small>
                }
              </div>

              <!-- Badges -->
              <div class="person-badges">
                @if (person.isPrimaryProfessional) {
                  <c-badge color="primary" class="me-1">Principal</c-badge>
                }
              </div>
            </button>
          </c-col>
        }
      </c-row>

    </c-card-body>
  </c-card>

}
