<div class="min-vh-100 d-flex flex-row align-items-center" style="background-color: var(--a11y-bg)">
  <c-container>
    <c-row class="justify-content-center">
      <c-col md="6">
        <div class="clearfix">
          <h1 class="float-start display-3 me-4" style="color: var(--a11y-text)">404</h1>
          <h4 class="pt-3" style="color: var(--a11y-text)">Oops! You're lost.</h4>
          <p class="float-start" style="color: var(--a11y-text-muted)">
            The page you are looking for was not found.
          </p>
        </div>
        <c-input-group class="input-prepend">
          <span cInputGroupText>
            <svg cIcon name="cilMagnifyingGlass"></svg>
          </span>
          <input cFormControl placeholder="What are you looking for?" type="text" />
          <button cButton color="info">Search</button>
        </c-input-group>
      </c-col>
    </c-row>
  </c-container>
</div>
