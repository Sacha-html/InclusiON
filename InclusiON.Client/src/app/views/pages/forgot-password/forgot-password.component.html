<c-container class="min-vh-100 d-flex align-items-center">
  <c-row class="justify-content-center w-100">
    <c-col md="6" lg="5">
      <c-card>
        <c-card-body>

          <div class="text-center mb-4">
            <svg cIcon name="cilLockLocked" size="3xl" style="color: var(--a11y-primary)" aria-hidden="true"></svg>
            <h1 class="h4 mt-3 mb-1" style="color: var(--a11y-text)">Recuperar contraseña</h1>
            <p class="mb-0 small" style="color: var(--a11y-text-muted)">
              Ingresá tu email y te enviaremos un enlace para restablecer tu contraseña.
            </p>
          </div>


          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label cLabel for="email">Email</label>
              <c-input-group>
                <span cInputGroupText>
                  <svg cIcon name="cilEnvelopeClosed" aria-hidden="true"></svg>
                </span>
                <input
                  cFormControl
                  id="email"
                  type="email"
                  formControlName="email"
                  placeholder="tu@email.com"
                  autocomplete="email"
                  [valid]="submitted ? f['email'].valid : undefined"
                />
              </c-input-group>
              @if (submitted && f['email'].errors?.['required']) {
                <c-form-feedback [valid]="false">El email es obligatorio.</c-form-feedback>
              }
              @if (submitted && f['email'].errors?.['email']) {
                <c-form-feedback [valid]="false">Ingresá un email válido.</c-form-feedback>
              }
            </div>

            <div class="d-grid mb-3">
              <button
                cButton
                color="primary"
                type="submit"
                class="a11y-btn-primary"
                [disabled]="isLoading"
              >
                @if (!isLoading) {
                  <svg cIcon name="cilSend" class="me-2" aria-hidden="true"></svg>
                  Enviar enlace de recuperación
                } @else {
                  <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                  Enviando...
                }
              </button>
            </div>
          </form>

          <div class="text-center">
            <a [routerLink]="['/admin-login']" style="color: var(--a11y-primary)">
              <svg cIcon name="cilArrowLeft" class="me-1" aria-hidden="true"></svg>
              Volver al inicio de sesión
            </a>
          </div>

        </c-card-body>
      </c-card>
    </c-col>
  </c-row>
</c-container>
