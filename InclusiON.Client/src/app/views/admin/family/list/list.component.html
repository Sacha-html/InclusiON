<app-institution-filter (filterChange)="onInstitutionFilterChange($event)" (loaded)="loadFamily()"></app-institution-filter>

<fieldset class="p-2 px-3 border rounded mb-3">
  <legend class="px-1 mb-1 fw-semibold text-body-secondary" style="font-size: 0.8rem; float: none; width: auto;">Filtros</legend>
  <div class="d-flex flex-wrap align-items-end gap-2">
    <div style="width: 180px; max-width: 100%;">
      <label cLabel sizing="sm" class="mb-1 text-body-secondary small fw-medium" for="filter-family-search">Responsable</label>
      <input cFormControl sizing="sm" id="filter-family-search" type="text" [(ngModel)]="familySearch" (ngModelChange)="onFamilySearch()" placeholder="Nombre o DNI">
    </div>
    <div style="width: 180px; max-width: 100%;">
      <label cLabel sizing="sm" class="mb-1 text-body-secondary small fw-medium" for="filter-linked-person">Alumno a cargo</label>
      <input cFormControl sizing="sm" id="filter-linked-person" type="text" [(ngModel)]="linkedPersonSearch" (ngModelChange)="onLinkedPersonSearch()" placeholder="Nombre o doc">
    </div>
    <div style="width: 140px; max-width: 100%;">
      <label cLabel sizing="sm" class="mb-1 text-body-secondary small fw-medium" for="filter-relationship">Parentesco</label>
      <select cSelect sizing="sm" id="filter-relationship" [(ngModel)]="relationshipFilter" (ngModelChange)="onRelationshipFilterChange()">
        <option value="">Todos</option>
        @for (rel of relationships; track rel) {
          <option [value]="rel">{{ rel }}</option>
        }
      </select>
    </div>
    <div style="width: 130px; max-width: 100%;">
      <label cLabel sizing="sm" class="mb-1 text-body-secondary small fw-medium" for="filter-is-primary">Familiar principal</label>
      <select cSelect sizing="sm" id="filter-is-primary" [(ngModel)]="isPrimaryFilter" (ngModelChange)="onIsPrimaryFilterChange()">
        <option value="">Todos</option>
        <option value="true">Sí</option>
        <option value="false">No</option>
      </select>
    </div>
    <div style="width: 130px; max-width: 100%;">
      <label cLabel sizing="sm" class="mb-1 text-body-secondary small fw-medium" for="filter-status">Estado</label>
      <select cSelect sizing="sm" id="filter-status" [(ngModel)]="statusFilter" (ngModelChange)="onStatusFilterChange()">
        <option value="">Todos</option>
        <option value="true">Activos</option>
        <option value="false">Inactivos</option>
      </select>
    </div>
    <div class="flex-shrink-0">
      <button cButton color="secondary" size="sm" variant="outline" (click)="clearFilters()">Limpiar filtros</button>
    </div>
  </div>
</fieldset>

<app-data-table
  title="Gestionar Familiares"
  [columns]="cols"
  [items]="families"
  [totalItems]="totalItems"
  [pageSize]="pageSize"
  [currentPage]="currentPage"
  [headerButtons]="canCreate ? [{action: 'new', label: 'Agregar'}] : []"
  (pageChange)="onPageChange($event)"
  (searchAction)="onSearch($event)"
  (sortAction)="onSort($event)"
  (rowAction)="onRowAction($event)"
  (headerAction)="onHeaderAction($event)">
</app-data-table>

<app-confirm-modal
  [visible]="showConfirmModal"
  title="Confirmar desactivación"
  messagePrefix="¿Está seguro de que desea desactivar al familiar "
  [itemName]="itemToDeactivate?.fullName ?? ''"
  messageSuffix="?"
  detail="Esta acción deshabilitará su acceso al sistema."
  confirmLabel="Desactivar"
  (confirm)="confirmDeactivate()"
  (cancel)="cancelDeactivate()">
</app-confirm-modal>

<app-password-modal
  [visible]="showPasswordModal"
  entityType="Familiar"
  entityArticle="el"
  [entityName]="reactivatedFamilyName"
  [password]="temporaryPassword"
  title="Familiar reactivado exitosamente"
  description="Se reactivo el familiar"
  (close)="closePasswordModal()">
</app-password-modal>

<app-confirm-modal
  [visible]="showReactivateModal"
  title="Confirmar reactivación"
  messagePrefix="¿Está seguro de que desea reactivar al familiar "
  [itemName]="itemToReactivate?.fullName ?? ''"
  messageSuffix="?"
  detail="Se generará una contraseña temporal y deberá cambiarla al iniciar sesión. No se restaurarán alumnos a cargo ni vínculos previos."
  confirmLabel="Reactivar"
  confirmColor="success"
  (confirm)="confirmReactivate()"
  (cancel)="cancelReactivate()">
</app-confirm-modal>
