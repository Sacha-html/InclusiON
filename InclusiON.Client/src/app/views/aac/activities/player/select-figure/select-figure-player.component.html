@if (phase() === 'intro') {
  <app-player-intro
    [title]="assignment.activityTitle"
    [instruction]="content.instruction || 'Seleccioná la figura correcta.'"
    [hint]="hint"
    [loading]="isLoading()"
    [error]="errorMsg()"
    (start)="startActivity()"
  />
}

@if (phase() === 'playing') {
  <div class="player-game" role="region" aria-labelledby="game-instruction">
    <h2 class="game-instruction" id="game-instruction" tabindex="-1">
      {{ content.instruction }}
    </h2>

    <div class="items-grid"
         role="group"
         aria-label="Opciones">
      @for (item of items; track item.id) {
        <app-pictogram-card
          [label]="item.label"
          [pictogramId]="item.pictogramId"
          [selected]="selectedItemId() === item.id"
          (cardClick)="selectItem(item)"
        />
      }
    </div>

    <div class="confirm-row">
      <button
        type="button"
        class="action-btn action-btn--primary"
        [disabled]="selectedItemId() === null"
        (click)="confirmSelection()"
        aria-label="Finalizar"
      >
        ✓ Finalizar
      </button>
    </div>
  </div>
}


@if (phase() === 'result') {
  <app-player-result
    [success]="(isCorrect() ? 100 : 0) >= 60"
    [score]="isCorrect() ? 100 : 0"
    [message]="resultMessage"
    [loading]="isLoading()"
    [canRetry]="canRetry"
    [attemptCount]="consecutiveFailures()"
    (finish)="onFinish()"
    (retry)="retry()"
  />
}
