@if (isLoading()) {
  <div class="shell-loading" role="status" aria-live="polite">
    <div class="loading-spinner" aria-hidden="true"></div>
    <p>Cargando actividad...</p>
  </div>
} @else if (hasError()) {
  <div class="shell-error" role="alert">
    <p>{{ errorMessage() }}</p>
    <button cButton class="back-btn" (click)="onCompleted()" aria-label="Volver a mis actividades">← Volver</button>
  </div>
} @else if (unsupported()) {
  <div class="shell-error" role="alert">
    <p>Este tipo de actividad no está disponible todavía.</p>
    <button cButton class="back-btn" (click)="onCompleted()" aria-label="Volver a mis actividades">← Volver</button>
  </div>
} @else {
  <!-- El player se monta dinámicamente aquí -->
  <div aria-live="polite" aria-label="Contenido de la actividad">
    <ng-container #playerHost></ng-container>
  </div>
}
