<div class="aac-home" role="region" aria-labelledby="aac-home-title">

  <header class="home-header">
    <svg cIcon [name]="timeIcon" class="greeting-icon" aria-hidden="true" focusable="false"></svg>
    <h1 id="aac-home-title" class="home-greeting">{{ greeting }}</h1>
  </header>

  <section class="quick-actions" aria-label="Acciones rápidas">
    <div class="actions-grid">
      <app-big-button
        label="Mi camino"
        icon="cilMap"
        [color]="'var(--a11y-nav-roadmap, var(--a11y-nav-home))'"
        (buttonClick)="goTo('/app/roadmap')"
      />
      <app-big-button
        label="Actividades"
        icon="cilTask"
        [color]="'var(--a11y-nav-activities)'"
        (buttonClick)="goTo('/app/activities')"
      />
      <app-big-button
        label="Hablar"
        icon="cilChatBubble"
        [color]="'var(--a11y-nav-talk)'"
        (buttonClick)="goTo('/app/talk')"
      />
    </div>
  </section>

</div>
