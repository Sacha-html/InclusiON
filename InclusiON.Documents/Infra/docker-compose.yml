services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres-vector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - inclusion_pgdata:/var/lib/postgresql/data
      - ../../InclusiON.Server/InclusiON.Data/Scripts/db-users-setup.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../InclusiON.Server
      dockerfile: Dockerfile
    container_name: inclusion_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_HTTPS_PORTS: ""
      ConnectionStrings__PostgreSqlConn: "Host=postgres-vector;Port=5432;Database=inclusion_dev;Username=inclusion_dev_app;Password=Inclusion_Dev_2025_!"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      SmtpSettings__Enabled: "false"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../../InclusiON.Client
      dockerfile: Dockerfile
    container_name: inclusion_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  inclusion_pgdata:
