<!--sidebar-->
<c-sidebar
  #sidebar1="cSidebar"
  class="d-print-none sidebar sidebar-fixed border-end"
  colorScheme="dark"
  id="sidebar1"
  visible
>
  <c-sidebar-header class="border-bottom">
    <c-sidebar-brand [routerLink]="[]" class="d-flex align-items-center">
      <!-- Logo completo para sidebar expandido -->
      <img
        src="./assets/images/logo/inclusion-logo.svg"
        alt="InclusiON - Plataforma Accesible"
        class="sidebar-brand-full"
        height="36"
      />

      <!-- Icono para sidebar colapsado -->
      <img
        src="./assets/images/logo/inclusion-icon.svg"
        alt="InclusiON"
        class="sidebar-brand-narrow"
        width="32"
        height="32"
      />
    </c-sidebar-brand>
  </c-sidebar-header>

  <ng-scrollbar pointerEventsMethod="scrollbar" visibility="hover">
    <c-sidebar-nav [navItems]="navItems" dropdownMode="close" compact />
  </ng-scrollbar>

  @if (!sidebar1.narrow) {
  <c-sidebar-footer
    cSidebarToggle="sidebar1"
    class="border-top d-none d-lg-flex"
    toggle="unfoldable"
    style="cursor: pointer"
  >
    <button cSidebarToggler aria-label="Toggle sidebar fold"></button>
  </c-sidebar-footer>
  }
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100">
  <!--app-header-->
  <app-default-header
    [cShadowOnScroll]="'sm'"
    class="mb-4 d-print-none header header-sticky p-0"
    position="sticky"
    sidebarId="sidebar1"
  />
  <!--app-body-->
  <main id="main-content" class="body flex-grow-1" tabindex="-1">
    <c-container breakpoint="lg" class="h-auto px-4">
      <router-outlet />
    </c-container>
  </main>
  <!--app footer-->
  <app-default-footer />
</div>

<app-toaster></app-toaster>
<app-accessibility-panel></app-accessibility-panel>
