<span class="skill-chip" [style.background-color]="color" [style.color]="textColor">
  @if (icon) {
    <span class="material-icons skill-chip__icon" aria-hidden="true">{{ icon }}</span>
  }
  <span class="skill-chip__name">{{ name }}</span>
  @if (removable) {
    <button
      type="button"
      class="btn-close skill-chip__close"
      [style.filter]="textColor === '#000000' ? 'none' : 'invert(1)'"
      (click)="remove.emit()"
      [attr.aria-label]="'Quitar ' + name"
    ></button>
  }
</span>
