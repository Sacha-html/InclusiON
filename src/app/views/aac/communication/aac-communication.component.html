<div class="aac-communication" role="region" aria-labelledby="aac-comm-title">
  <h1 id="aac-comm-title" class="page-title">Comunicacion</h1>

  <section class="quick-phrases" aria-labelledby="phrases-title">
    <h2 id="phrases-title" class="section-title">Frases rapidas</h2>
    <div class="phrases-grid" role="list">
      @for (phrase of phrases; track phrase.id) {
        <div role="listitem">
          <app-big-button
            [label]="phrase.text"
            [icon]="phrase.icon"
            [color]="phrase.color"
            (buttonClick)="speak(phrase.text)"
          />
        </div>
      }
    </div>
  </section>

  <section class="feelings" aria-labelledby="feelings-title">
    <h2 id="feelings-title" class="section-title">Como me siento</h2>
    <div class="feelings-grid" role="list">
      @for (feeling of feelings; track feeling.id) {
        <div role="listitem">
          <button
            class="feeling-btn"
            [style.--feeling-color]="feeling.color"
            (click)="speak('Me siento ' + feeling.label)"
            [attr.aria-label]="'Decir: Me siento ' + feeling.label">
            <span class="feeling-emoji" aria-hidden="true">{{ feeling.emoji }}</span>
            <span class="feeling-label">{{ feeling.label }}</span>
          </button>
        </div>
      }
    </div>
  </section>
</div>
