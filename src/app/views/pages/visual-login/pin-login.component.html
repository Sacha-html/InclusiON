<!-- Panel de Accesibilidad -->
<app-accessibility-panel></app-accessibility-panel>

<div class="visual-login-container min-vh-100 d-flex flex-column align-items-center justify-content-center">
  <div class="content-wrapper">
    <!-- Back Button -->
    <div class="mb-4">
      <button
        cButton
        color="light"
        class="back-button"
        (click)="goBack()"
        aria-label="Volver a identificación de usuario"
      >
        <svg cIcon name="cilArrowLeft" class="me-2" aria-hidden="true"></svg>
        <span>Volver</span>
      </button>
    </div>

    <!-- Main Card -->
    <div class="pin-card card border-0 shadow">
      <div class="card-body p-4 p-md-5">
        <!-- User Avatar -->
        <div class="text-center mb-4">
          <div
            class="user-avatar mx-auto mb-3"
            [style.background-color]="avatarColor"
          >
            {{ initial }}
          </div>
          <h2 class="h4 fw-bold mb-1">Hola, {{ displayName }}</h2>
          <p class="text-muted">Toca los números de tu PIN</p>
        </div>

        <!-- Error Alert -->
        @if (errorMessage) {
          <div
            class="alert mb-4 text-center"
            [class.alert-warning]="isLocked"
            [class.alert-danger]="!isLocked"
            role="alert"
          >
            @if (isLocked) {
              <svg cIcon name="cilLockLocked" class="me-2"></svg>
            } @else {
              <svg cIcon name="cilWarning" class="me-2"></svg>
            }
            {{ errorMessage }}
          </div>
        }

        <!-- PIN Dots -->
        <div class="pin-display mb-4" role="status" [attr.aria-label]="'PIN ingresado: ' + pin.length + ' de ' + maxPinLength + ' dígitos'">
          @for (filled of pinDots; track $index) {
            <div
              class="pin-dot"
              [class.filled]="filled"
              [class.error]="errorMessage && pin.length === 0"
            ></div>
          }
        </div>

        <!-- PIN Pad -->
        <div class="pin-pad" [class.disabled]="isLoading || isLocked">
          @for (row of pinPad; track $index) {
            <div class="pin-row">
              @for (key of row; track key) {
                <button
                  class="pin-key"
                  [class.special]="key === 'clear' || key === 'submit'"
                  [class.clear]="key === 'clear'"
                  [class.submit]="key === 'submit'"
                  [disabled]="isLoading || isLocked || (key === 'submit' && pin.length !== maxPinLength)"
                  (click)="handlePadClick(key)"
                  [attr.aria-label]="getPadKeyAriaLabel(key)"
                  type="button"
                >
                  @if (key === 'submit' && isLoading) {
                    <span class="spinner-border spinner-border-sm"></span>
                  } @else {
                    {{ getPadKeyLabel(key) }}
                  }
                </button>
              }
            </div>
          }
        </div>

        <!-- Remember Device -->
        <div class="mt-4 text-center">
          <div class="form-check d-inline-block">
            <input
              class="form-check-input"
              type="checkbox"
              id="rememberDevice"
              [(ngModel)]="rememberDevice"
              [disabled]="isLoading"
            />
            <label class="form-check-label" for="rememberDevice">
              Recordar este dispositivo
            </label>
          </div>
        </div>

        <!-- Help -->
        <div class="text-center mt-4">
          <p class="text-muted small mb-0">
            <svg cIcon name="cilInfo" class="me-1"></svg>
            ¿Lo olvidaste? Pide ayuda
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
