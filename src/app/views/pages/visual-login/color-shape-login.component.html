<!-- Panel de Accesibilidad -->
<app-accessibility-panel></app-accessibility-panel>

<div class="visual-login-container min-vh-100 d-flex flex-column align-items-center justify-content-center">
  <div class="content-wrapper">
    <!-- Back Button -->
    <div class="mb-4">
      <button
        cButton
        color="light"
        class="back-button"
        (click)="goBack()"
        aria-label="Volver a identificación de usuario"
      >
        <svg cIcon name="cilArrowLeft" class="me-2" aria-hidden="true"></svg>
        <span>Volver</span>
      </button>
    </div>

    <!-- Main Card -->
    <div class="color-shape-card card border-0 shadow">
      <div class="card-body p-4 p-md-5">
        <!-- User Avatar -->
        <div class="text-center mb-4">
          <div
            class="user-avatar mx-auto mb-3"
            [style.background-color]="avatarColor"
          >
            {{ initial }}
          </div>
          <h2 class="h4 fw-bold mb-1">Hola, {{ displayName }}</h2>
          <p class="text-muted fs-5">Toca tu figura</p>
        </div>

        <!-- Error Alert -->
        @if (errorMessage) {
          <div
            class="alert mb-4 text-center"
            [class.alert-warning]="isLocked"
            [class.alert-danger]="!isLocked"
            role="alert"
          >
            @if (isLocked) {
              <svg cIcon name="cilLockLocked" class="me-2"></svg>
            } @else {
              <svg cIcon name="cilWarning" class="me-2"></svg>
            }
            {{ errorMessage }}
          </div>
        }

        <!-- Shape Grid -->
        <div class="shape-grid" [class.disabled]="isLoading || isLocked" role="radiogroup" aria-label="Selecciona tu figura">
          @for (shape of colorShapes; track shape.id) {
            <button
              class="shape-button"
              [class.selected]="isSelected(shape)"
              [disabled]="isLoading || isLocked"
              (click)="selectShape(shape)"
              [attr.aria-label]="getShapeAriaLabel(shape)"
              [attr.aria-checked]="isSelected(shape)"
              role="radio"
              type="button"
            >
              <div class="shape-container">
                @switch (shape.shape) {
                  @case ('circle') {
                    <div class="shape circle" [style.background-color]="shape.color"></div>
                  }
                  @case ('square') {
                    <div class="shape square" [style.background-color]="shape.color"></div>
                  }
                  @case ('triangle') {
                    <div class="shape triangle" [style.border-bottom-color]="shape.color"></div>
                  }
                  @case ('star') {
                    <div class="shape star" [style.color]="shape.color">★</div>
                  }
                }
              </div>
              @if (isSelected(shape)) {
                <div class="selection-indicator">
                  <svg cIcon name="cilCheckCircle"></svg>
                </div>
              }
            </button>
          }
        </div>

        <!-- Submit Button -->
        <div class="d-flex justify-content-center mt-4">
          <button
            cButton
            color="primary"
            size="lg"
            class="px-5"
            (click)="onSubmit()"
            [disabled]="isLoading || selectedShapeId === null"
            aria-label="Confirmar selección"
          >
            @if (isLoading) {
              <span class="spinner-border spinner-border-sm me-2"></span>
              Verificando...
            } @else {
              <svg cIcon name="cilCheckCircle" class="me-2"></svg>
              Confirmar
            }
          </button>
        </div>

        <!-- Remember Device -->
        <div class="mt-4 text-center">
          <div class="form-check d-inline-block">
            <input
              class="form-check-input"
              type="checkbox"
              id="rememberDevice"
              [(ngModel)]="rememberDevice"
              [disabled]="isLoading"
            />
            <label class="form-check-label" for="rememberDevice">
              Recordar este dispositivo
            </label>
          </div>
        </div>

        <!-- Help -->
        <div class="text-center mt-4">
          <p class="text-muted small mb-0">
            <svg cIcon name="cilInfo" class="me-1"></svg>
            ¿No la recuerdas? Pide ayuda
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
