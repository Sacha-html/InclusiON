<!-- Panel de Accesibilidad -->
<app-accessibility-panel></app-accessibility-panel>

<div class="visual-login-container min-vh-100 d-flex flex-column align-items-center justify-content-center">
  <div class="content-wrapper">
    <!-- Back Button -->
    <div class="mb-4">
      <button
        cButton
        color="light"
        class="back-button"
        (click)="goBack()"
        aria-label="Volver a identificacion de usuario"
      >
        <svg cIcon name="cilArrowLeft" class="me-2" aria-hidden="true"></svg>
        <span>Volver</span>
      </button>
    </div>

    <!-- Main Card -->
    <div class="login-card card border-0 shadow">
      <div class="card-body p-4 p-md-5">
        <!-- User Avatar -->
        <div class="text-center mb-4">
          <div
            class="user-avatar mx-auto mb-3"
            [style.background-color]="avatarColor"
          >
            {{ initial }}
          </div>
          <h2 class="h4 fw-bold mb-1">Hola, {{ displayName }}</h2>
          <p class="text-muted">Ingresa tu contrasena para continuar</p>
        </div>

        <!-- Error Alert -->
        @if (errorMessage) {
          <div
            class="alert mb-4 text-center"
            [class.alert-warning]="isLocked"
            [class.alert-danger]="!isLocked"
            role="alert"
          >
            @if (isLocked) {
              <svg cIcon name="cilLockLocked" class="me-2"></svg>
            } @else {
              <svg cIcon name="cilWarning" class="me-2"></svg>
            }
            {{ errorMessage }}
          </div>
        }

        <!-- Password Form -->
        <form (ngSubmit)="onSubmit()" class="password-form">
          <div class="mb-4">
            <label for="password" class="form-label visually-hidden">Contrasena</label>
            <c-input-group size="lg">
              <span cInputGroupText>
                <svg cIcon name="cilLockLocked"></svg>
              </span>
              <input
                cFormControl
                [type]="showPassword ? 'text' : 'password'"
                id="password"
                [(ngModel)]="password"
                name="password"
                placeholder="Tu contrasena"
                [disabled]="isLoading || isLocked"
                autocomplete="current-password"
                class="password-input"
              />
              <button
                type="button"
                cButton
                color="secondary"
                variant="outline"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="showPassword ? 'Ocultar contrasena' : 'Mostrar contrasena'"
              >
                <svg cIcon [name]="showPassword ? 'cilLowVision' : 'cilDescription'"></svg>
              </button>
            </c-input-group>
          </div>

          <!-- Remember Device -->
          <div class="mb-4">
            <c-form-check>
              <input
                cFormCheckInput
                type="checkbox"
                id="rememberDevice"
                [(ngModel)]="rememberDevice"
                name="rememberDevice"
                [disabled]="isLoading"
              />
              <label cFormCheckLabel for="rememberDevice">
                Recordar este dispositivo
              </label>
            </c-form-check>
          </div>

          <!-- Submit Button -->
          <button
            cButton
            color="primary"
            type="submit"
            size="lg"
            class="w-100 submit-button"
            [disabled]="!password || isLoading || isLocked"
          >
            @if (isLoading) {
              <c-spinner size="sm" class="me-2"></c-spinner>
              Verificando...
            } @else {
              <svg cIcon name="cilLockUnlocked" class="me-2"></svg>
              Entrar
            }
          </button>
        </form>

        <!-- Help -->
        <div class="text-center mt-4">
          <p class="text-muted small mb-0">
            <svg cIcon name="cilInfo" class="me-1"></svg>
            ¿Olvidaste tu contrasena? Pide ayuda a un familiar o profesional
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
