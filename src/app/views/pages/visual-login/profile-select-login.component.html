<!-- Panel de Accesibilidad -->
<app-accessibility-panel></app-accessibility-panel>

<div class="visual-login-container min-vh-100 d-flex flex-column align-items-center justify-content-center">
  <div class="content-wrapper">
    <!-- Back Button -->
    <div class="mb-4">
      <button
        cButton
        color="light"
        class="back-button"
        (click)="goBack()"
        aria-label="Volver a identificación de usuario"
      >
        <svg cIcon name="cilArrowLeft" class="me-2" aria-hidden="true"></svg>
        <span>Volver</span>
      </button>
    </div>

    <!-- Main Card -->
    <div class="profile-card card border-0 shadow">
      <div class="card-body p-4 p-md-5">
        @if (!isConfirming) {
          <!-- Profile Selection View -->
          <div class="text-center">
            <h2 class="h3 fw-bold mb-4">¿Eres tú?</h2>

            <!-- Error Alert -->
            @if (errorMessage) {
              <div class="alert alert-danger mb-4 text-center" role="alert">
                <svg cIcon name="cilWarning" class="me-2"></svg>
                {{ errorMessage }}
              </div>
            }

            <!-- Profile Card -->
            <button
              class="profile-button mx-auto mb-4"
              (click)="onSelectProfile()"
              [disabled]="isLoading"
              [attr.aria-label]="'Confirmar que eres ' + displayName"
            >
              <div
                class="profile-avatar"
                [style.background-color]="avatarColor"
              >
                {{ initial }}
              </div>
              <h3 class="profile-name mt-3 mb-0">{{ displayName }}</h3>
              @if (isLoading) {
                <div class="loading-overlay">
                  <span class="spinner-border spinner-border-lg"></span>
                </div>
              }
            </button>

            <p class="text-muted fs-5 mb-4">
              Toca tu foto para entrar
            </p>

            <button
              cButton
              color="link"
              class="fs-6"
              (click)="goToRoleSelection()"
              aria-label="No soy yo, elegir otro usuario"
            >
              No soy yo
            </button>
          </div>
        } @else {
          <!-- PIN Confirmation View -->
          <div class="text-center">
            <h2 class="h3 fw-bold mb-3">Confirma tu identidad</h2>
            <p class="text-muted mb-4">Ingresa el PIN de confirmación</p>

            <!-- Error Alert -->
            @if (errorMessage) {
              <div class="alert alert-danger mb-4 text-center" role="alert">
                <svg cIcon name="cilWarning" class="me-2"></svg>
                {{ errorMessage }}
              </div>
            }

            <!-- PIN Input -->
            <div class="pin-input-container mb-4">
              <input
                type="password"
                class="pin-input"
                [(ngModel)]="confirmationPin"
                maxlength="6"
                placeholder="****"
                [disabled]="isLoading"
                (keydown.enter)="onConfirmWithPin()"
                aria-label="PIN de confirmación"
                autofocus
              />
            </div>

            <div class="d-flex justify-content-center gap-3">
              <button
                cButton
                color="secondary"
                size="lg"
                (click)="cancelConfirmation()"
                [disabled]="isLoading"
              >
                Cancelar
              </button>
              <button
                cButton
                color="primary"
                size="lg"
                (click)="onConfirmWithPin()"
                [disabled]="isLoading || confirmationPin.length < 4"
              >
                @if (isLoading) {
                  <span class="spinner-border spinner-border-sm me-2"></span>
                  Verificando...
                } @else {
                  Confirmar
                }
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
