<!-- Panel de Accesibilidad -->
<app-accessibility-panel></app-accessibility-panel>

<div class="visual-login-container min-vh-100 d-flex flex-column align-items-center justify-content-center">
  <div class="role-cards-wrapper">
    <!-- Header -->
    <div class="text-center mb-5">
      <h1 class="display-4 fw-bold text-primary mb-3">Bienvenido a InclusiON</h1>
      <p class="lead text-muted fs-4">Selecciona cómo quieres ingresar</p>
    </div>

    <!-- Role Cards -->
    <div class="row g-4 g-xl-5">
      @for (role of roles; track role.type) {
        <div class="col-12 col-md-6 col-lg-4">
          <div
            class="role-card card h-100 shadow-sm"
            [style.--role-color]="role.color"
            [style.--role-bg]="role.bgColor"
            (click)="selectRole(role.type)"
            tabindex="0"
            role="button"
            [attr.aria-label]="role.title + ': ' + role.description"
            (keydown.enter)="selectRole(role.type)"
            (keydown.space)="selectRole(role.type); $event.preventDefault()"
          >
            <div class="card-body d-flex flex-column align-items-center text-center p-4 p-lg-5">
              <div class="role-icon-container mb-4">
                <svg
                  cIcon
                  [name]="role.icon"
                  class="role-icon"
                  [style.color]="role.color"
                ></svg>
              </div>
              <h2 class="h3 mb-3 fw-bold role-title">{{ role.title }}</h2>
              <p class="text-muted mb-0 fs-5 role-description">{{ role.description }}</p>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- Admin Login Link (small, unobtrusive) -->
    <div class="text-center mt-5 pt-4">
      <button
        cButton
        color="link"
        class="text-muted small"
        (click)="goToAdminLogin()"
        aria-label="Acceso para administradores"
      >
        Acceso administrativo
      </button>
    </div>
  </div>
</div>
