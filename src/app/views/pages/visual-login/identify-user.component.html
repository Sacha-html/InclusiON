<!-- Panel de Accesibilidad -->
<app-accessibility-panel></app-accessibility-panel>

<div class="visual-login-container min-vh-100 d-flex flex-column align-items-center justify-content-center">
  <div class="content-wrapper">
    <!-- Back Button -->
    <div class="mb-4">
      <button
        cButton
        color="light"
        class="back-button"
        (click)="goBack()"
        aria-label="Volver a selección de tipo de usuario"
      >
        <svg cIcon name="cilArrowLeft" class="me-2" aria-hidden="true"></svg>
        <span>Volver</span>
      </button>
    </div>

    <!-- Main Card -->
    <div class="identify-card card border-0 shadow">
      <div class="card-body p-4 p-md-5">
        <!-- Header -->
        <div class="text-center mb-5">
          <div class="user-type-badge mb-3">
            {{ userTypeLabel }}
          </div>
          <h1 class="h2 fw-bold mb-3">¿Cómo te llamas?</h1>
          <p class="text-muted fs-5">Escribe tu nombre para encontrar tu cuenta</p>
        </div>

        <!-- Error Alert -->
        @if (errorMessage) {
          <div class="alert alert-danger mb-4" role="alert">
            <svg cIcon name="cilWarning" class="me-2"></svg>
            {{ errorMessage }}
          </div>
        }

        <!-- Input -->
        <div class="mb-4">
          <div class="input-group input-group-lg">
            <span class="input-group-text bg-light">
              <svg cIcon name="cilUser" class="text-primary"></svg>
            </span>
            <input
              type="text"
              class="form-control form-control-lg"
              [(ngModel)]="identifier"
              [placeholder]="placeholderText"
              autocomplete="name"
              [disabled]="isLoading"
              (keydown.enter)="onIdentify()"
              aria-label="Tu nombre"
              autofocus
            />
            @if (identifier) {
              <button
                cButton
                color="light"
                class="border"
                (click)="clearInput()"
                aria-label="Limpiar"
                type="button"
              >
                <svg cIcon name="cilX"></svg>
              </button>
            }
          </div>
        </div>

        <!-- Submit Button -->
        <div class="d-grid">
          <button
            cButton
            color="primary"
            size="lg"
            class="py-3 fs-4"
            (click)="onIdentify()"
            [disabled]="isLoading || !identifier.trim()"
            aria-label="Buscar mi cuenta"
          >
            @if (isLoading) {
              <span class="spinner-border spinner-border-sm me-2"></span>
              Buscando...
            } @else {
              <svg cIcon name="cilSearch" class="me-2"></svg>
              Buscar mi cuenta
            }
          </button>
        </div>

        <!-- Help Text -->
        <div class="text-center mt-4">
          <p class="text-muted mb-0">
            <svg cIcon name="cilInfo" class="me-1"></svg>
            Si no recuerdas tu nombre, pide ayuda a alguien de confianza
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
