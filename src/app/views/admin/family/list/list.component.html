<app-institution-filter (filterChange)="onInstitutionFilterChange($event)" (loaded)="loadFamily()"></app-institution-filter>

<fieldset class="p-3 border rounded mb-4">
  <legend class="px-2 mb-2 fw-bold text-body-secondary" style="font-size: 0.9rem; float: none;">Filtros</legend>
  <c-row class="align-items-end">
    <c-col sm="3">
      <label class="form-label">Buscar por persona a cargo</label>
      <input type="text" class="form-control" [(ngModel)]="linkedPersonSearch" (keyup.enter)="onLinkedPersonSearch()" placeholder="Nombre o documento de la persona">
    </c-col>
    <c-col sm="auto">
      <button cButton color="secondary" variant="outline" (click)="clearLinkedPersonSearch()">Limpiar</button>
    </c-col>
  </c-row>
</fieldset>

<app-data-table
  title="Gestión de Familiares"
  [columns]="cols"
  [items]="families"
  [totalItems]="totalItems"
  [pageSize]="pageSize"
  [currentPage]="currentPage"
  [headerButtons]="canCreate ? [{action: 'new', label: 'Agregar'}] : []"
  (pageChange)="onPageChange($event)"
  (searchAction)="onSearch($event)"
  (rowAction)="onRowAction($event)"
  (headerAction)="onHeaderAction($event)">
</app-data-table>

<app-confirm-modal
  [visible]="showConfirmModal"
  title="Confirmar desactivacion"
  messagePrefix="¿Esta seguro de que desea desactivar al familiar "
  [itemName]="itemToDeactivate?.fullName ?? ''"
  messageSuffix="?"
  detail="Esta accion deshabilitara su acceso al sistema."
  confirmLabel="Desactivar"
  (confirm)="confirmDeactivate()"
  (cancel)="cancelDeactivate()">
</app-confirm-modal>
