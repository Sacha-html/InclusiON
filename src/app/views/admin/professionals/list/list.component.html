<app-institution-filter (filterChange)="onInstitutionFilterChange($event)" (loaded)="loadProfessionals()"></app-institution-filter>

<app-data-table
  title="Profesionales"
  [columns]="cols"
  [items]="professionals"
  [totalItems]="totalItems"
  [pageSize]="pageSize"
  [currentPage]="currentPage"
  [headerButtons]="canCreate ? [{action: 'new', label: 'Nuevo Profesional'}] : []"
  (pageChange)="onPageChange($event)"
  (searchAction)="onSearch($event)"
  (rowAction)="onRowAction($event)"
  (headerAction)="onHeaderAction($event)">
</app-data-table>

<app-confirm-modal
  [visible]="showConfirmModal"
  title="Confirmar desactivacion"
  [message]="itemToDeactivate ? '¿Esta seguro de que desea desactivar al profesional <strong>' + itemToDeactivate.fullName + '</strong>?' : ''"
  detail="Esta accion deshabilitara su acceso al sistema."
  confirmLabel="Desactivar"
  (confirm)="confirmDeactivate()"
  (cancel)="cancelDeactivate()">
</app-confirm-modal>
