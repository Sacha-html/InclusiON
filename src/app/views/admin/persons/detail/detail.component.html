@if (person) {
  <c-card>
    <c-card-header>
      <h2 class="h5 mb-0">Detalle de Persona con Discapacidad</h2>
    </c-card-header>
    <c-card-body>

      <!-- Tabs -->
      <ul class="nav nav-tabs mb-3" role="tablist" aria-label="Secciones de persona" (keydown)="onTabKeydown($event)">
        <li class="nav-item" role="presentation">
          <button type="button" class="nav-link" id="tab-datos" role="tab"
                  [class.active]="activeTab === 'datos'"
                  [attr.aria-selected]="activeTab === 'datos'"
                  aria-controls="panel-datos"
                  (click)="activeTab = 'datos'">
            Datos Personales
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button type="button" class="nav-link" id="tab-habilidades" role="tab"
                  [class.active]="activeTab === 'habilidades'"
                  [attr.aria-selected]="activeTab === 'habilidades'"
                  aria-controls="panel-habilidades"
                  (click)="activeTab = 'habilidades'">
            Habilidades
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button type="button" class="nav-link" id="tab-vinculos" role="tab"
                  [class.active]="activeTab === 'vinculos'"
                  [attr.aria-selected]="activeTab === 'vinculos'"
                  aria-controls="panel-vinculos"
                  (click)="activeTab = 'vinculos'">
            Vínculos
            @if (representatives.length > 0) {
              <c-badge color="primary" class="ms-1" [attr.aria-label]="representatives.length + ' vínculos'">{{ representatives.length }}</c-badge>
            }
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button type="button" class="nav-link" id="tab-diagnosticos" role="tab"
                  [class.active]="activeTab === 'diagnosticos'"
                  [attr.aria-selected]="activeTab === 'diagnosticos'"
                  aria-controls="panel-diagnosticos"
                  (click)="activeTab = 'diagnosticos'">
            Diagnósticos
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button type="button" class="nav-link" id="tab-accesibilidad" role="tab"
                  [class.active]="activeTab === 'accesibilidad'"
                  [attr.aria-selected]="activeTab === 'accesibilidad'"
                  aria-controls="panel-accesibilidad"
                  (click)="activeTab = 'accesibilidad'">
            Accesibilidad
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button type="button" class="nav-link" id="tab-reportes" role="tab"
                  [class.active]="activeTab === 'reportes'"
                  [attr.aria-selected]="activeTab === 'reportes'"
                  aria-controls="panel-reportes"
                  (click)="activeTab = 'reportes'">
            Reportes
          </button>
        </li>
      </ul>

      <!-- Tab: Datos Personales -->
      @if (activeTab === 'datos') {
        <div role="tabpanel" id="panel-datos" aria-labelledby="tab-datos" tabindex="0">
          <app-person-basic-info
            [person]="person"
            (deactivate)="showDeactivateModal = true">
          </app-person-basic-info>
        </div>
      }

      <!-- Tab: Habilidades -->
      @if (activeTab === 'habilidades') {
        <div role="tabpanel" id="panel-habilidades" aria-labelledby="tab-habilidades" tabindex="0">
          <app-person-skills
            [person]="person"
            [skillProfile]="skillProfile"
            [availableSkillAreas]="allSkillAreas"
            [showAddModal]="showAddSkillAreaModal"
            [loading]="skillAreaLoading"
            [error]="skillAreaError"
            (removeSkillArea)="deactivateSkillArea($event)"
            (openAddModal)="loadSkillAreas()"
            (closeModal)="closeAddSkillAreaModal()"
            (confirmAdd)="confirmAddSkillAreasFromChild($event)">
          </app-person-skills>
        </div>
      }

      <!-- Tab: Reportes -->
      @if (activeTab === 'reportes') {
        <div role="tabpanel" id="panel-reportes" aria-labelledby="tab-reportes" tabindex="0">
          <app-admin-person-reports [personId]="person.id"></app-admin-person-reports>
        </div>
      }

      <!-- Tab: Diagnósticos -->
      @if (activeTab === 'diagnosticos') {
        <div role="tabpanel" id="panel-diagnosticos" aria-labelledby="tab-diagnosticos" tabindex="0">
          <app-admin-diagnoses [personId]="person.id" [person]="person"></app-admin-diagnoses>
        </div>
      }

      <!-- Tab: Accesibilidad -->
      @if (activeTab === 'accesibilidad') {
        <div role="tabpanel" id="panel-accesibilidad" aria-labelledby="tab-accesibilidad" tabindex="0">
          <app-person-accessibility [person]="person"></app-person-accessibility>
        </div>
      }

      <!-- Tab: Vinculos -->
      @if (activeTab === 'vinculos') {
        <div role="tabpanel" id="panel-vinculos" aria-labelledby="tab-vinculos" tabindex="0">
          <app-person-links
            [person]="person"
            [representatives]="representatives"
            [loading]="loadingRepresentatives"
            [canLink]="canLink"
            [canUnlink]="canUnlink"
            [canViewHistory]="canViewHistory"
            [showLinkModal]="showLinkModal"
            [linkError]="linkFamilyError"
            [linking]="linkingFamily"
            [showUnlinkModal]="showUnlinkModal"
            [unlinkingRepresentative]="unlinkingRepresentative"
            [unlinking]="unlinking"
            [showHistoryModal]="showHistoryModal"
            [linkHistory]="linkHistory"
            [loadingHistory]="loadingHistory"
            (openLinkModal)="openLinkModal()"
            [searchFamilyFn]="searchFamilyFn"
            (closeLinkModal)="closeLinkModal()"
            (confirmLink)="confirmLinkFromChild($event)"
            (unlink)="openUnlinkModal($event)"
            (closeUnlinkModal)="closeUnlinkModal()"
            (confirmUnlink)="confirmUnlinkFromChild($event)"
            (openHistoryModal)="openHistoryModal()"
            (closeHistoryModal)="closeHistoryModal()">
          </app-person-links>
        </div>
      }
    </c-card-body>
  </c-card>
}

<app-confirm-modal
  [visible]="showDeactivateModal"
  title="Confirmar desactivación"
  messagePrefix="¿Está seguro de que desea desactivar a "
  [itemName]="person?.fullName ?? ''"
  messageSuffix="?"
  detail="Se revocará su acceso al sistema inmediatamente."
  confirmLabel="Desactivar"
  (confirm)="confirmDeactivate()"
  (cancel)="showDeactivateModal = false">
</app-confirm-modal>
