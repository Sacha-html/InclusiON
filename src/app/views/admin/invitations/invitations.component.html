<fieldset class="p-3 border rounded mb-4">
  <legend class="px-2 mb-2 fw-bold text-body-secondary" style="font-size: 0.9rem; float: none;">Filtros</legend>
  <c-row class="align-items-end g-2">
    <c-col sm="3">
      <label cLabel>Estado</label>
      <select cSelect [(ngModel)]="statusFilter" (ngModelChange)="onFilterChange()">
        <option value="">Todos</option>
        <option value="Enviada">Enviadas</option>
        <option value="Aceptada">Aceptadas</option>
        <option value="Expirada">Expiradas</option>
      </select>
    </c-col>
    <c-col sm="auto">
      <button cButton color="secondary" (click)="clearFilters()">Limpiar</button>
    </c-col>
  </c-row>
</fieldset>

<app-data-table
  title="Invitaciones del Sistema"
  [columns]="cols"
  [items]="invitations"
  [totalItems]="totalItems"
  [pageSize]="pageSize"
  [currentPage]="currentPage"
  [loading]="isLoading"
  (pageChange)="onPageChange($event)"
  (searchAction)="onSearch($event)">
</app-data-table>
