@if (isLoading) {
  <div class="text-center p-5">
    <c-spinner color="primary"></c-spinner>
  </div>
} @else {

  <c-card class="mb-4">
    <c-card-header>
      <h5 class="mb-0">Mi Aula</h5>
    </c-card-header>
    <c-card-body>

      @if (activePersons.length === 0) {
        <app-empty-state
          icon="cil-people"
          message="No tenés personas asignadas"
          detail="Solicitá al administrador que te asigne personas a cargo."
        />
      }

      <c-row>
        @for (person of activePersons; track person.personId) {
          <c-col sm="6" md="4" lg="3" class="mb-4">
            <button type="button" class="person-card" (click)="goToDetail(person)" [attr.aria-label]="'Ver detalle de ' + person.personFullName">
              <!-- Avatar -->
              <app-actor-avatar
                [name]="person.personFullName"
                [color]="person.avatarColor"
                size="lg"
              />

              <!-- Info -->
              <div class="person-info">
                <h6 class="person-name mb-1">{{ person.personFullName }}</h6>

                @if (person.disabilityTypeName) {
                  <small class="text-body-secondary d-block">{{ person.disabilityTypeName }}</small>
                }

                @if (person.age) {
                  <small class="text-body-secondary">{{ person.age }} años</small>
                }
              </div>

              <!-- Badges -->
              <div class="person-badges">
                @if (person.isPrimaryProfessional) {
                  <c-badge color="primary" class="me-1">Principal</c-badge>
                }
              </div>
            </button>
          </c-col>
        }
      </c-row>

    </c-card-body>
  </c-card>

}
