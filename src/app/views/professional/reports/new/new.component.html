<c-card>
  <c-card-header>
    <h5 cCardTitle>Nuevo Reporte</h5>
  </c-card-header>
  <c-card-body>
    <p class="text-body-secondary mb-3">Los campos marcados con (*) son obligatorios.</p>
    
    <form (ngSubmit)="onSubmit()">
      <c-row class="mb-4">
        <!-- Persona -->
        <c-col xs="12" md="6">
          <label class="form-label">Persona con discapacidad *</label>
          <input
            cFormControl
            class="mb-2"
            placeholder="Buscar por nombre..."
            [(ngModel)]="personSearch"
            name="personSearch"
            (input)="onPersonSearch($any($event.target).value)"
          />
          <select
            cFormControl
            [(ngModel)]="form().personId"
            name="personId"
            required
          >
            <option value="">Seleccionar persona...</option>
            @for (person of filteredPersons(); track person.id) {
              <option [value]="person.id">
                {{ person.firstName }} {{ person.lastName }}
              </option>
            }
          </select>
        </c-col>

        <!-- Tipo de Reporte -->
        <c-col xs="12" md="6">
          <label class="form-label">Tipo de Reporte *</label>
          <select
            cFormControl
            [(ngModel)]="form().reportTypeId"
            name="reportTypeId"
            required
          >
            <option [value]="0">Seleccionar tipo...</option>
            <option [value]="1">Evaluación Mensual</option>
            <option [value]="2">Informe de Progreso</option>
            <option [value]="3">Evaluación Trimestral</option>
            <option [value]="4">Informe Anual</option>
          </select>
        </c-col>
      </c-row>

      <!-- Título -->
      <c-row class="mb-4">
        <c-col xs="12">
          <label class="form-label">Título *</label>
          <input
            cFormControl
            [(ngModel)]="form().title"
            name="title"
            placeholder="Ej: Informe de progreso - Marzo 2026"
            required
          />
        </c-col>
      </c-row>

      <!-- Contenido -->
      <c-row class="mb-4">
        <c-col xs="12">
          <label class="form-label">Contenido *</label>
          <textarea
            cFormControl
            [(ngModel)]="form().content"
            name="content"
            rows="5"
            placeholder="Describe el contenido del reporte..."
            required
          ></textarea>
        </c-col>
      </c-row>

      <!-- Período -->
      <c-row class="mb-4">
        <c-col xs="12" md="6">
          <label class="form-label">Fecha inicio período</label>
          <input
            cFormControl
            type="date"
            [(ngModel)]="form().periodStartDate"
            name="periodStartDate"
          />
        </c-col>
        <c-col xs="12" md="6">
          <label class="form-label">Fecha fin período</label>
          <input
            cFormControl
            type="date"
            [(ngModel)]="form().periodEndDate"
            name="periodEndDate"
          />
        </c-col>
      </c-row>

      <!-- Objetivos alcanzados -->
      <c-row class="mb-4">
        <c-col xs="12">
          <label class="form-label">Objetivos alcanzados</label>
          <textarea
            cFormControl
            [(ngModel)]="form().achievedGoals"
            name="achievedGoals"
            rows="3"
            placeholder="Describe los objetivos alcanzados durante el período..."
          ></textarea>
        </c-col>
      </c-row>

      <!-- Áreas a reforzar -->
      <c-row class="mb-4">
        <c-col xs="12">
          <label class="form-label">Áreas a reforzar</label>
          <textarea
            cFormControl
            [(ngModel)]="form().areasToReinforce"
            name="areasToReinforce"
            rows="3"
            placeholder="Describe las áreas que requieren refuerzo..."
          ></textarea>
        </c-col>
      </c-row>

      <!-- Recomendaciones -->
      <c-row class="mb-4">
        <c-col xs="12">
          <label class="form-label">Recomendaciones</label>
          <textarea
            cFormControl
            [(ngModel)]="form().futureRecommendations"
            name="futureRecommendations"
            rows="3"
            placeholder="Sugiere recomendaciones para el futuro..."
          ></textarea>
        </c-col>
      </c-row>

      <!-- Próximos objetivos -->
      <c-row class="mb-4">
        <c-col xs="12">
          <label class="form-label">Próximos objetivos</label>
          <textarea
            cFormControl
            [(ngModel)]="form().nextObjectives"
            name="nextObjectives"
            rows="3"
            placeholder="Describe los próximos objetivos a trabajar..."
          ></textarea>
        </c-col>
      </c-row>

      <!-- Botones -->
      <c-row>
        <c-col xs="12">
          <button cButton type="submit" color="primary" [disabled]="isLoading() || !isValid()">
            @if (isLoading()) {
              <c-spinner size="sm"></c-spinner>
            }
            Guardar
          </button>
          <button cButton type="button" color="secondary" class="ms-2" (click)="onCancel()">
            Cancelar
          </button>
        </c-col>
      </c-row>
    </form>
  </c-card-body>
</c-card>
