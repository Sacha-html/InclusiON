@if (isLoading()) {
  <div class="text-center py-4">
    <c-spinner></c-spinner>
  </div>
} @else {

  @if (wasRejected && adminComment) {
    <c-alert color="danger" class="mb-3">
      <strong>Motivo de rechazo:</strong> {{ adminComment }}
    </c-alert>
  }

  <c-card>
    <c-card-header>
      <h5 cCardTitle>Editar Reporte</h5>
    </c-card-header>
    <c-card-body>
      <p class="text-body-secondary mb-3">Los campos marcados con (*) son obligatorios.</p>

      @if (serverError) {
        <c-alert color="danger" class="mb-3">{{ serverError }}</c-alert>
      }

      <form (ngSubmit)="onSubmit()">
        <c-row class="mb-4">
          <!-- Tipo de Reporte -->
          <c-col xs="12" md="6">
            <label class="form-label" for="reportTypeId">Tipo de Reporte *</label>
            <select
              cSelect
              id="reportTypeId"
              [(ngModel)]="form.reportTypeId"
              name="reportTypeId"
              required
            >
              <option [value]="0">Seleccionar tipo...</option>
              @for (type of reportTypes(); track type.id) {
                <option [value]="type.id">{{ type.name }}</option>
              }
            </select>
          </c-col>

          <!-- Fecha del Reporte -->
          <c-col xs="12" md="6">
            <label class="form-label" for="reportDate">Fecha del reporte *</label>
            <input
              cFormControl
              id="reportDate"
              type="date"
              [(ngModel)]="form.reportDate"
              name="reportDate"
              required
            />
          </c-col>
        </c-row>

        <!-- Título -->
        <c-row class="mb-4">
          <c-col xs="12">
            <label class="form-label" for="report-title">Título *</label>
            <input
              cFormControl
              id="report-title"
              [(ngModel)]="form.title"
              name="title"
              placeholder="Ej: Informe de progreso - Marzo 2026"
              required
            />
          </c-col>
        </c-row>

        <!-- Contenido -->
        <c-row class="mb-4">
          <c-col xs="12">
            <label class="form-label" for="report-content">Contenido *</label>
            <textarea
              cFormControl
              id="report-content"
              [(ngModel)]="form.content"
              name="content"
              rows="5"
              placeholder="Describe el contenido del reporte..."
              required
            ></textarea>
          </c-col>
        </c-row>

        <!-- Período -->
        <c-row class="mb-4">
          <c-col xs="12" md="6">
            <label class="form-label" for="period-start">Fecha inicio período</label>
            <input
              cFormControl
              id="period-start"
              type="date"
              [(ngModel)]="form.periodStartDate"
              name="periodStartDate"
            />
          </c-col>
          <c-col xs="12" md="6">
            <label class="form-label" for="period-end">Fecha fin período</label>
            <input
              cFormControl
              id="period-end"
              type="date"
              [(ngModel)]="form.periodEndDate"
              name="periodEndDate"
            />
          </c-col>
        </c-row>

        <!-- Objetivos alcanzados -->
        <c-row class="mb-4">
          <c-col xs="12">
            <label class="form-label" for="achieved-goals">Objetivos alcanzados</label>
            <textarea
              cFormControl
              id="achieved-goals"
              [(ngModel)]="form.achievedGoals"
              name="achievedGoals"
              rows="3"
              placeholder="Describe los objetivos alcanzados durante el período..."
            ></textarea>
          </c-col>
        </c-row>

        <!-- Áreas a reforzar -->
        <c-row class="mb-4">
          <c-col xs="12">
            <label class="form-label" for="areas-to-reinforce">Áreas a reforzar</label>
            <textarea
              cFormControl
              id="areas-to-reinforce"
              [(ngModel)]="form.areasToReinforce"
              name="areasToReinforce"
              rows="3"
              placeholder="Describe las áreas que requieren refuerzo..."
            ></textarea>
          </c-col>
        </c-row>

        <!-- Recomendaciones -->
        <c-row class="mb-4">
          <c-col xs="12">
            <label class="form-label" for="future-recommendations">Recomendaciones</label>
            <textarea
              cFormControl
              id="future-recommendations"
              [(ngModel)]="form.futureRecommendations"
              name="futureRecommendations"
              rows="3"
              placeholder="Sugiere recomendaciones para el futuro..."
            ></textarea>
          </c-col>
        </c-row>

        <!-- Próximos objetivos -->
        <c-row class="mb-4">
          <c-col xs="12">
            <label class="form-label" for="next-objectives">Próximos objetivos</label>
            <textarea
              cFormControl
              id="next-objectives"
              [(ngModel)]="form.nextObjectives"
              name="nextObjectives"
              rows="3"
              placeholder="Describe los próximos objetivos a trabajar..."
            ></textarea>
          </c-col>
        </c-row>

        <!-- Botones -->
        <c-row>
          <c-col xs="12">
            <button cButton type="submit" color="primary" [disabled]="isSaving() || !isValid">
              @if (isSaving()) {
                <c-spinner size="sm" class="me-1" aria-hidden="true"></c-spinner>
              }
              Guardar cambios
            </button>
            <button cButton type="button" color="secondary" class="ms-2" (click)="onCancel()">
              Cancelar
            </button>
          </c-col>
        </c-row>
      </form>
    </c-card-body>
  </c-card>
}
