<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" width="180" height="40">
  <!-- Logo InclusiON para sidebar (fondo oscuro) -->

  <!-- Símbolo de inclusión: círculo con persona -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2">
    <circle cx="18" cy="20" r="14"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="18" cy="14" r="3.5"/>
